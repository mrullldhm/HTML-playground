<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="POST" enctype="multipart/form-data">
      <label for="username">Username</label>
      <input type="text" id="username" />
      <br /><br />

      <label for="password">Password</label>
      <input type="password" id="password" />
      <br /><br />

      <label for="email">Email</label>
      <input type="email" id="email" />
      <br /><br />

      <label for="phone">Phone</label>
      <input type="tel" id="phone" />
      <br /><br />

      <label for="bday">Birthdate</label>
      <input type="date" id="bday" />
      <br /><br />

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" min="0" />
      <br /><br />

      <label for="title">Title :</label>
      <label for="Mr.">Mr.</label>
      <input type="radio" id="Mr." value="Mr." name="title" />
      <label for="Ms.">Ms.</label>
      <input type="radio" id="Ms." value="Ms." name="title" />
      <label for="PhD.">PhD.</label>
      <input type="radio" id="PhD." value="PhD." name="title" />
      <br /><br />

      <label for="payment">Payment</label>
      <select name="payment" id="payment">
        <option value="visa">Visa</option>
        <option value="mastercard">Mastercard</option>
        <option value="online-banking">Online Banking</option>
      </select>
      <br /><br />

      <label for="subscribe">Subscribe</label>
      <input type="checkbox" id="subscribe" />
      <br /><br />

      <label for="comment">Comment</label><br />
      <textarea name="" id="comment" rows="3" cols="30"></textarea>
      <br /><br />

      <label for="file">File</label>
      <input type="file" id="file" accept="image/png" />
      <br /><br />

      <input type="reset" />
      <input type="submit" />
    </form>
  </body>
</html>
